[workspace]
members = [
    "crates/ts_goport",
    "crates/ts_goport/parts/goport_lsproto",
    "crates/ts_goport/parts/goport_util",
    "crates/ts_wasm",
    "tools/ts_ast_codegen",
    "tools/ts_diagnostics_codegen",
]
resolver = "3"

[workspace.package]
version = "7.0.0-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/microsoft/typescript-go"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Release profile for the goport binaries: `cargo build --profile goport`.
# Binaries land in <target>/goport/. Other crates keep the default release
# settings, and the test and dev profiles (used by the regression) do not
# inherit this.
[profile.goport]
inherits = "release"
lto = "fat"
codegen-units = 1

# Size profile for the wasm build (crates/ts_wasm, scripts/wasm/build.sh):
# `cargo build --profile wasm --target wasm32-wasip1`. wasm cannot unwind,
# so panics abort. Panic messages stay.
# opt-level "s", not "z": "z" ignores `#[inline]` hints. Its module was 8%
# smaller, but it checked a mid-sized project 20% slower. build.sh lowers
# the inline limit of "s" for `#[inline]` functions.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
