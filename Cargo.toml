[workspace]
members = [
    "crates/ts_core",
    "crates/ts_ast",
    "crates/ts_binder",
    "crates/ts_bundled",
    "crates/ts_checker",
    "crates/ts_parser",
    "crates/ts_path",
    "crates/ts_module",
    "crates/ts_glob",
    "crates/ts_fswatch",
    "crates/ts_incremental",
    "crates/ts_jsnum",
    "crates/ts_jsonrpc",
    "crates/ts_lsp",
    "crates/ts_options",
    "crates/ts_outputpaths",
    "crates/ts_printer",
    "crates/ts_project",
    "crates/ts_scanner",
    "crates/ts_semver",
    "crates/ts_sourcemap",
    "crates/ts_cli",
    "crates/ts_config",
    "crates/ts_compiler",
    "crates/ts_diagnostics",
    "crates/ts_diagnostic_writer",
    "crates/ts_evaluator",
    "crates/ts_vfs",
    "crates/ts_watch",
    "crates/ts_goport",
    "tools/ts_ast_codegen",
    "tools/ts_compare",
    "tools/ts_diagnostics_codegen",
    "tools/ts_fixture",
]
resolver = "3"

[workspace.package]
version = "7.0.0-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/microsoft/typescript-go"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Release profile for the goport binaries: `cargo build --profile goport`.
# Binaries land in <target>/goport/. Other crates keep the default release
# settings, and the test and dev profiles (used by the regression) do not
# inherit this.
[profile.goport]
inherits = "release"
lto = "fat"
codegen-units = 1
