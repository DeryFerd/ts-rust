[workspace]
members = [
    "crates/ts_core",
    "crates/ts_ast",
    "crates/ts_parser",
    "crates/ts_path",
    "crates/ts_scanner",
    "crates/ts_cli",
    "crates/ts_config",
    "crates/ts_diagnostics",
    "crates/ts_vfs",
    "tools/ts_ast_codegen",
    "tools/ts_compare",
    "tools/ts_diagnostics_codegen",
    "tools/ts_fixture",
]
resolver = "3"

[workspace.package]
version = "7.0.0-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/microsoft/typescript-go"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
