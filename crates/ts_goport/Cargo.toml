[package]
name = "ts_goport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ts_ast = { path = "../ts_ast" }
ts_compiler = { path = "../ts_compiler" }
ts_core = { path = "../ts_core" }
ts_diagnostic_writer = { path = "../ts_diagnostic_writer" }
ts_diagnostics = { path = "../ts_diagnostics" }
ts_jsnum = { path = "../ts_jsnum" }
ts_module = { path = "../ts_module" }
ts_options = { path = "../ts_options" }
ts_parser = { path = "../ts_parser" }
ts_scanner = { path = "../ts_scanner" }
ts_path = { path = "../ts_path" }
ts_vfs = { path = "../ts_vfs" }
rustc-hash = "=2.1.2"
indexmap = "=2.14.0"
memchr = "=2.8.2"
smallvec = "=1.15.1"
bumpalo = "=3.20.3"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }
tikv-jemallocator = { version = "=0.7.0", optional = true }

[features]
# Opt-in: jemalloc as the global allocator of the goport binaries. It is
# faster than glibc malloc but costs query peak RSS (see bin/goport.rs
# `set_malloc_tunables`).
jemalloc = ["dep:tikv-jemallocator"]

[lints]
workspace = true
