[package]
name = "ts_goport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Parts of this crate built as their own crates. Their files stay in src/
# (see src/goport_util_root.rs and src/goport_lsproto_root.rs).
goport_lsproto = { path = "parts/goport_lsproto" }
goport_util = { path = "parts/goport_util" }
rustc-hash = "=2.1.2"
indexmap = "=2.14.0"
memchr = "=2.8.2"
smallvec = "=1.15.1"
bumpalo = "=3.20.3"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }
flate2 = "=1.1.10"
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
rustix = { version = "=1.1.5", features = ["event", "fs", "pipe", "process", "termios"] }
# Go `os/signal` Notify for `signal.NotifyContext` in cmd/tsgo (--watch, --lsp).
signal-hook = "=0.4.4"
# fswatch/unix.rs: fanotify_init/fanotify_mark and name_to_handle_at, which
# rustix does not wrap (safe APIs; see the module comment). `process`:
# prctl(PR_SET_THP_DISABLE) in thp_guard.rs.
nix = { version = "=0.31.3", default-features = false, features = ["fanotify", "process"] }
name-to-handle-at = "=0.1.0"
tikv-jemallocator = { version = "=0.7.0", optional = true }

[features]
default = ["jemalloc"]
# jemalloc as the global allocator of the goport binaries (default; the
# shipped build). `--no-default-features` gives glibc malloc with its
# tunables. See bin/goport.rs `set_malloc_tunables`.
jemalloc = ["dep:tikv-jemallocator"]

[lints]
workspace = true

# Rust port of the pinned typescript-go baseline tests. `test = false` keeps
# it out of `cargo test --workspace`; run it with `--test go_baselines`.
[[test]]
name = "go_baselines"
path = "tests/go_baselines/main.rs"
test = false
