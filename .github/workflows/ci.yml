# Format, lint, build and test on every pull request and on each push to main that changes code.
# The full protected set (TestLocal shards, gate, bound runs, LSP and API oracles, np-suite) stays in
# the revision pipeline (scripts/goport/candidate.sh). This workflow is a fast check that the tree
# builds and its own tests pass on Linux and macOS.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "UPSTREAM.json"
      - "scripts/upstream/pin.py"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0
  # The toolchain of shipped bins, fmt and clippy (scripts/goport/README.md, "Build toolchain").
  RUSTUP_TOOLCHAIN: 1.93.0

jobs:
  lint:
    name: fmt, codegen, clippy
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - name: Generated AST files match the codegen
        run: |
          cargo run --locked --quiet -p ts_ast_codegen -- check crates/ts_goport/src/astdata/syntax_kind.rs
          cargo run --locked --quiet -p ts_ast_codegen -- check-ast crates/ts_goport/src/astdata/ast_generated.rs
      # The packages of the revision quality step (candidate.sh): 0 warnings.
      - run: cargo clippy --locked -p ts_goport -p goport_util -p goport_lsproto --all-targets -- -D warnings

  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Blacksmith runners (the pingdotgg org has the app), as T3 Code uses.
        runner: [blacksmith-16vcpu-ubuntu-2404, blacksmith-12vcpu-macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # One test thread, as goport-tests.sh runs them.
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # main's Go pin is the saved state's batch.upstreamPin.to. UPSTREAM.json "current" can be an older
      # pin until the default pin switch (AGENTS.md, "Pin").
      - name: Resolve the Go pin
        id: pin
        run: |
          key=$(jq -r '.batch.upstreamPin.to // empty' docs/typechecker-state/current.json)
          python3 scripts/upstream/pin.py show ${key:+"$key"} > "$RUNNER_TEMP/pin.json"
          jq -r '"repo=\(.repo)", "commit=\(.commit)", "subdir=\(.subdir // "")"' "$RUNNER_TEMP/pin.json" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned Go source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: go-pin
          sparse-checkout: ${{ steps.pin.outputs.subdir }}
          persist-credentials: false
      # The go_baselines temp roots default to zbook paths on Linux (/tmp on macOS).
      - name: Set the test paths
        run: |
          echo "TS_GO_REPO=$GITHUB_WORKSPACE/go-pin${SUBDIR:+/$SUBDIR}" >> "$GITHUB_ENV"
          echo "TSCTEST_TMP=$RUNNER_TEMP/tsctest" >> "$GITHUB_ENV"
          echo "COMPILER_RUNNER_TMP=$RUNNER_TEMP/compiler-runner" >> "$GITHUB_ENV"
        env:
          SUBDIR: ${{ steps.pin.outputs.subdir }}
      # The astnav tests run the JS TypeScript of the Go repo's lockfile under Node (Go
      # testutil/jstest: <repo>/node_modules/typescript). Only that package, not the repo's npm ci.
      - name: Install the Go repo's typescript package
        run: |
          url=$(jq -r '.packages["node_modules/typescript"].resolved' go-pin/package-lock.json)
          mkdir -p go-pin/node_modules/typescript
          curl -sSfL "$url" | tar xz -C go-pin/node_modules/typescript --strip-components=1
          jq -r .version go-pin/node_modules/typescript/package.json
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          cargo test --release --locked --workspace --no-run
          cargo test --release --locked -p ts_goport --test go_baselines --no-run
      - name: Unit and integration tests
        run: cargo test --release --locked --workspace --no-fail-fast
      # go_baselines has `test = false`, so --workspace skips it. TestLocal (about 12,700 compiler
      # cases) runs in 4 shards in goport-tests.sh, in the revision pipeline; the rest of the default
      # go_baselines set runs here.
      - name: Go baselines
        run: |
          skip=(--skip compiler_runner::test_local)
          # Open on macOS: the 10 tests of project_lsp/resolveahead_test.rs (resolveahead1, merged
          # after the macOS port) have never passed there. 9 find no resolve-ahead load and 1 finds
          # no configured project. They pass on Linux.
          [[ $RUNNER_OS != macOS ]] || skip+=(--skip project_lsp::resolveahead_test::)
          cargo test --release --locked --no-fail-fast -p ts_goport --test go_baselines -- "${skip[@]}"
