# Builds the darwin-arm64 tsc of the tsc-rs npm packages on a Mac, and uploads it as the artifact
# tsc-darwin-arm64. jemalloc does not cross-build for macOS with zig, so this build runs here.
# npm/README.md has the release steps: the artifact goes to
# `npm-pack.sh --name tsc-rs --also darwin-arm64=<tsc>`.
name: tsc-rs darwin build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "npm/**"
      - "scripts/goport/npm-pack.sh"
      - ".github/workflows/tsc-rs-darwin.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The toolchain of crates/ts_goport/scripts/build-release.sh.
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # The shipped profile (fat LTO) with Go's noembed mode, as build-release.sh builds Linux. No
      # GOPORT_BUILD_VERSION: the tsc reports the TypeScript version, which typesVersions matching
      # reads (npm/pack.mjs).
      - run: cargo build --profile goport --locked -p ts_goport --bin tsgo --features noembed
      - name: Check the tsc
        run: |
          out="$RUNNER_TEMP/tsc"
          crates/ts_goport/scripts/copy-libs.sh "$out"
          cp target/goport/tsgo "$out/tsc"
          "$out/tsc" --version
          [[ $("$out/tsc" --version) == "Version 7."* ]]
          cd "$RUNNER_TEMP"
          echo 'const x: number = "a";' > a.ts
          "$out/tsc" --listFilesOnly --lib es5 a.ts | grep -qx "$out/lib.es5.d.ts"
          set +e
          "$out/tsc" --noEmit a.ts > check.txt
          rc=$?
          set -e
          cat check.txt
          [[ $rc == 2 ]] && grep -q "error TS2322" check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tsc-darwin-arm64
          path: target/goport/tsgo
          if-no-files-found: error
