# A Blacksmith testbox: a warm Linux x64 runner that runs builds and tests against the local tree
# (scripts/goport/testbox.sh). `blacksmith testbox warmup` dispatches this workflow, `testbox run` syncs
# the working tree to it and runs one command. The setup matches the Linux test job of ci.yml, with
# zbook's toolchains. Sticky disks keep target/ and the cargo registry warm between testboxes.
# A pull request that changes this file or testbox-remote.sh runs it in validation mode (no testbox_id).
name: Blacksmith Testbox

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
  pull_request:
    paths:
      - ".github/workflows/testbox.yml"
      - "scripts/goport/testbox-remote.sh"

permissions:
  contents: read

concurrency:
  group: testbox-${{ inputs.testbox_id || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The toolchain of shipped bins and --profile goport. Edit-loop builds use the nightly of
  # scripts/run-cargo-capped.sh.
  RUSTUP_TOOLCHAIN: 1.93.0
  NIGHTLY_TOOLCHAIN: nightly-2026-06-17

jobs:
  testbox:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 360
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # After checkout: its clean step would empty a disk mounted in the workspace. A sticky disk commits only
      # when the job ends with no failed or cancelled step: the idle timeout end commits (testbox.sh release),
      # `blacksmith testbox stop` cancels the job and does not (testbox.sh stop).
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ts-rust-testbox-target
          path: ${{ github.workspace }}/target
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ts-rust-testbox-cargo
          path: ~/.cargo/registry
      - name: Install bubblewrap
        # goport-tests.sh and pin.py exec run tests in bwrap.
        run: sudo apt-get install -y --no-install-recommends bubblewrap || { sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap; }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # main's Go pin is the saved state's batch.upstreamPin.to (AGENTS.md, "Pin").
      - name: Resolve the Go pin
        id: pin
        run: |
          key=$(jq -r '.batch.upstreamPin.to // empty' docs/typechecker-state/current.json)
          python3 scripts/upstream/pin.py show ${key:+"$key"} > "$RUNNER_TEMP/pin.json"
          jq -r --arg key "$key" '"key=\($key)", "goCheckout=\(.goCheckout)", "go=\(.oracle.go | ltrimstr("go"))"' "$RUNNER_TEMP/pin.json" >> "$GITHUB_OUTPUT"
      # UPSTREAM.json and the protected scripts use zbook's absolute paths: /home/theo/Code/sandbox/ts-rust is the
      # workspace, the whole pin checkout (with node_modules) sits at its zbook path, and the oracles that
      # testbox.sh seeded on the sticky target/ (target/testbox-oracles) are installed at theirs.
      - name: Mirror zbook's paths
        run: scripts/goport/testbox-remote.sh setup ${{ steps.pin.outputs.key }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.pin.outputs.go }}
          cache: false
      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c rustfmt,clippy
          rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal
          # Remote commands run without this job's RUSTUP_TOOLCHAIN. 1.93.0 is the default, as on zbook;
          # run-cargo-capped.sh picks the nightly for edit-loop builds.
          rustup default "$RUSTUP_TOOLCHAIN"
      # testbox.sh sources this file before each command: commands run over SSH, without this job's env.
      # TS_CARGO_CGROUP_ACTIVE=1 skips the systemd user scope of run-cargo-capped.sh (no user session here).
      - name: Write the testbox env
        env:
          GO_CHECKOUT: ${{ steps.pin.outputs.goCheckout }}
        run: |
          cat > "$HOME/testbox.env" <<EOF
          export PATH="$(dirname "$(command -v go)"):$(dirname "$(command -v node)"):$HOME/.cargo/bin:\$PATH"
          export CARGO_TERM_COLOR=always
          export TS_GO_REPO="$GO_CHECKOUT"
          export TSCTEST_TMP="$RUNNER_TEMP/tsctest"
          export COMPILER_RUNNER_TMP="$RUNNER_TEMP/compiler-runner"
          export TS_CARGO_CGROUP_ACTIVE=1
          export TS_CARGO_JOBS=32
          export TS_CARGO_SLOTS=1
          EOF
          cat "$HOME/testbox.env"
      - name: Run Testbox
        uses: useblacksmith/run-testbox@v2
        if: always()
